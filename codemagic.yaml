workflows:
  ios-awg-build:
    name: AmneziaWG iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install Go and SwiftLint
        script: |
          brew install swiftlint go
      - name: Build IPA without signing
        script: |
          echo "=== Listing schemes ==="
          xcodebuild -project WireGuard.xcodeproj -list
          
          echo "=== Building ==="
          xcodebuild -project WireGuard.xcodeproj \
            -scheme AmneziaWG \
            -config Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/WireGuard.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" || \
          xcodebuild -project WireGuard.xcodeproj \
            -scheme WireGuard \
            -config Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/WireGuard.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

          echo "=== Making IPA ==="
          mkdir -p $CM_BUILD_DIR/build/Payload
          cp -R $CM_BUILD_DIR/WireGuard.xcarchive/Products/Applications/*.app $CM_BUILD_DIR/build/Payload/
          cd $CM_BUILD_DIR/build
          zip -r AmneziaWG-unsigned.ipa Payload
    artifacts:
      - build/*.ipa
