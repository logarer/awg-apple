workflows:
  ios-awg-build:
    name: AmneziaWG iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_WORKSPACE: "WireGuard.xcodeproj"
    scripts:
      - name: Install Go and SwiftLint
        script: |
          brew install swiftlint go
      - name: Build IPA without signing
        script: |
          # اول یک فایل exportOptions میسازیم
          cat > /tmp/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild -project WireGuard.xcodeproj \
            -scheme WireGuardApp \
            -config Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/WireGuard.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

          # تبدیل به IPA بدون امضا
          mkdir -p $CM_BUILD_DIR/build/ipa
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/WireGuard.xcarchive \
            -exportPath $CM_BUILD_DIR/build/ipa \
            -exportOptionsPlist /tmp/exportOptions.plist CODE_SIGNING_ALLOWED=NO || true
          
          # اگر بالا نشد، به صورت دستی IPA میسازیم
          cd $CM_BUILD_DIR/build
          mkdir -p Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/WireGuard*.app Payload/ 2>/dev/null || cp -r $CM_BUILD_DIR/WireGuard.xcarchive/Products/Applications/*.app Payload/
          zip -r AmneziaWG-unsigned.ipa Payload
    artifacts:
      - build/ipa/*.ipa
      - build/*.ipa
